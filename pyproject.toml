[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "math-intelligence-mcp"
version = "0.1.0"
description = "Math Intelligence MCP - Mathematical Intelligence para Agentes IA"
requires-python = ">=3.11"
keywords = ["mcp", "mathematics", "secp256k1", "ai-agents", "cryptography"]
license = "MIT"
authors = ["qrodrigob <qrodrigob@gmail.com>"]
 classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
 ]

[project.dependencies]
# Dependências principais
bunyan >= 1.8.15
zod-py >= 0.3.0

# Dependências de desenvolvimento
[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-mock>=3.10.0",
    "black>=22.3.0",
    "ruff>=0.1.0",
]

[project.scripts]
mimcp = "mimcp:main"
mimcp-tools = "mimcp.tools:list_tools"

[tool.black]
line-length = 88
target_version = None

[tool.ruff]
select = ["E", "F", "W", "ASCII"]

[tool.pytest.ini_options]
test_paths = ["tests"]
